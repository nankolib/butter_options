# Opta RPC proxy micro-cache — location-context half. Ticket 86eyn66b4 (D4).
#
# Deployed as /etc/nginx/snippets/opta-rpc-cache.conf and pulled into the
# `location /devnet` block of /etc/nginx/sites-available/rpc.opta.fyi with a
# single line:
#
#     include /etc/nginx/snippets/opta-rpc-cache.conf;
#
# Kept as an include rather than an inline edit so the surrounding block — which
# holds the injected api-key, the CORS headers and the WebSocket upgrade wiring —
# is never rewritten by a deploy.
#
# See opta-rpc-cache.conf for the allow/deny/batch/upgrade decision.

# $request_body is only populated when the body fits in memory; otherwise it is
# spooled to a temp file and the variable is EMPTY, which would poison a
# body-keyed cache. A generous buffer plus single-buffer keeps JSON-RPC bodies in
# memory, and the fail-closed map means an empty body is passed through live
# rather than cached under a blank key.
client_body_buffer_size      128k;
client_body_in_single_buffer on;

proxy_cache        opta_rpc;
proxy_cache_methods POST;

# The body IS the request here — every call hits the same URI — so it has to be
# part of the key.
proxy_cache_key "$request_method|$uri|$request_body";

proxy_no_cache     $opta_rpc_nocache;
proxy_cache_bypass $opta_rpc_nocache;

# The upstream sits behind Cloudflare and returns a `set-cookie: __cf_bm=...`
# bot-management cookie on every response. nginx refuses to store ANY response
# carrying Set-Cookie, which is why the first cut of this config produced
# MISS/MISS forever. Two directives are needed, and both matter:
#
#   proxy_ignore_headers Set-Cookie  -> allows the response to be stored at all
#   proxy_hide_header    Set-Cookie  -> strips it so a cached entry can never
#                                       replay one client's cookie to another
#
# Ignoring without hiding would be a cross-client cookie leak. The cookie is
# Cloudflare's, scoped to the upstream, and no client needs it: every request
# reaches the upstream through this one proxy identity.
#
# Cache-Control and Expires are listed defensively in case the upstream starts
# sending them; Vary is deliberately NOT ignored, so nginx keeps honouring
# `Vary: Accept-Encoding` and cannot hand a gzipped body to a client that did not
# ask for one.
proxy_ignore_headers Set-Cookie Cache-Control Expires;
proxy_hide_header    Set-Cookie;

# Only 200s are cacheable. 429 (credit exhaustion) and 401 must never be stored:
# caching an outage would extend it past its actual end.
proxy_cache_valid 200 2s;

# Collapse concurrent identical requests into one upstream call. This is where
# the Trade page wins: four hooks scan the same discriminators simultaneously, and
# without the lock each one is a separate 10-credit scan.
proxy_cache_lock          on;
proxy_cache_lock_timeout  25s;
proxy_cache_lock_age      25s;

# Exposed so hit rate can be measured rather than assumed.
add_header X-Opta-Cache $upstream_cache_status always;
