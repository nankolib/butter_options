# Opta RPC proxy — rpc.opta.fyi
# Served from the same Vultr box 144.202.58.6 as opta.fyi web + crank + sb-create.
#
# WHY: the mobile store APK bakes its RPC endpoint at build time and can never be
# updated in place, so it must NOT carry a paid key. This proxy fronts a paid
# Helius devnet endpoint — clients hit https://rpc.opta.fyi/devnet with NO api-key;
# the key lives ONLY on this box (from ~/.opta-rpc-helius) and is injected here.
#
# Path-namespaced on purpose: /devnet now; /mainnet reserved for later so the
# baked-in store URL never has to change.
#
# HTTP-only here; `certbot --nginx -d rpc.opta.fyi` adds the 443 server block +
# the 80->443 redirect (same flow as opta.fyi.conf). Does NOT touch other blocks.
#
# DEPLOY: replace <HELIUS_DEVNET_KEY> below with the key from ~/.opta-rpc-helius
# on the box (never commit the real key). Then: nginx -t && systemctl reload nginx.

# Per-IP rate limit to protect the paid Helius quota from abuse.
limit_req_zone $binary_remote_addr zone=rpc_devnet:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name rpc.opta.fyi;

    # Devnet JSON-RPC — client sends no key; nginx injects it upstream.
    location /devnet {
        limit_req zone=rpc_devnet burst=40 nodelay;

        # CORS (RN needs none; the web app shares this origin).
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://opta.fyi" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin "https://opta.fyi" always;

        # Strip the /devnet prefix, inject the key server-side, forward to Helius.
        rewrite ^/devnet/?$ / break;
        set $args "api-key=<HELIUS_DEVNET_KEY>";
        proxy_pass https://devnet.helius-rpc.com;
        proxy_set_header Host devnet.helius-rpc.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Reserved for a future mainnet proxy — 404 until wired.
    location /mainnet {
        return 404;
    }

    location / {
        return 404;
    }
}
