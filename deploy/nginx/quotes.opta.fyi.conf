# ============================================================================
# quotes.opta.fyi — TLS front for the loopback opta-quotes service (127.0.0.1:8090)
# ============================================================================
# Honest-stale equity quote proxy. Server-side ONLY (SB On-Demand oracles + the
# crank fetch it) — NEVER a browser, so NO CORS. The Finnhub key lives in the
# service env (/opt/opta-quotes/.env), NOT here. Both legs return 503 when the
# upstream print is stale (off-hours) so the crossbar median produces no value.
# Deploy pattern mirrors feeds.opta.fyi (nginx -> loopback service).
# ============================================================================

limit_req_zone $binary_remote_addr zone=quotes:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name quotes.opta.fyi;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quotes.opta.fyi;

    ssl_certificate     /etc/letsencrypt/live/quotes.opta.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quotes.opta.fyi/privkey.pem;

    # SB oracles + crank fetch a few tickers x 2 legs; the service caches 10s so
    # upstream (Finnhub free 60/min, Yahoo) is protected. Generous per-IP cap.
    location / {
        limit_req zone=quotes burst=60 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }
}
