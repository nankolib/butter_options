# Opta web — security + CSP headers, ported from app/vercel.json.
# `include`d per-location in opta.fyi.conf because nginx add_header does NOT
# inherit into a location once that location declares any add_header of its own.
# CSP matches app/vercel.json's (TradingView + PostHog) MINUS vercel.live
# (Vercel-preview-only, dead off-Vercel). worker-src blob: covers PostHog replay.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://s3.tradingview.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://hermes.pyth.network https://hermes-beta.pyth.network https://api.devnet.solana.com https://api.mainnet-beta.solana.com https://*.helius-rpc.com https://sb-create.opta.fyi wss://api.devnet.solana.com wss://api.mainnet-beta.solana.com wss://*.helius-rpc.com https://us.i.posthog.com https://us-assets.i.posthog.com; frame-src 'self' https://*.tradingview.com https://www.tradingview-widget.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=()" always;
