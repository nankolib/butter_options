# Opta RPC proxy micro-cache — http-context half. Ticket 86eyn66b4 (D4).
#
# WHY
#   The proxy served 46,275 requests on 2026-08-14 (45,825 of them from a single
#   mobile client polling at ~32 req/min) and there was no caching of any kind.
#   The mobile APK bakes its endpoint at build time and can never be updated in
#   place, so nginx is the ONLY place existing installs can be throttled.
#
# TTL
#   2 seconds. Long enough to collapse a poll burst and the Trade page's four
#   concurrent identical scans; short enough that no user ever sees a stale
#   balance for longer than a block or two.
#
# SAFETY MODEL — fail closed
#   Only getProgramAccounts and getAccountInfo may be cached. Everything else is
#   served live. The combining map below defaults to "do not cache", so any body
#   we cannot parse (including an empty $request_body when the body was spooled
#   to disk) is passed straight through rather than guessed at.
#
# Deployed as /etc/nginx/conf.d/opta-rpc-cache.conf (nginx.conf includes conf.d/*.conf).

proxy_cache_path /var/cache/nginx/opta-rpc
                 levels=1:2
                 keys_zone=opta_rpc:16m
                 max_size=2g
                 inactive=60s
                 use_temp_path=off;

# 1 when the body names a method we are permitted to cache.
map $request_body $opta_rpc_allow {
    default                                                  0;
    ~*"method"[[:space:]]*:[[:space:]]*"getProgramAccounts"   1;
    ~*"method"[[:space:]]*:[[:space:]]*"getAccountInfo"       1;
}

# 1 when the body mentions ANY method that must never be served from cache.
#
# getSignatureStatuses and getLatestBlockhash are called out explicitly: a stale
# signature status would break the buy-path exactly-once guard, and a stale
# blockhash produces transactions that fail or, worse, replay. The rest are here
# because they either move money or must observe real time.
map $request_body $opta_rpc_deny {
    default 0;
    ~*"method"[[:space:]]*:[[:space:]]*"(sendTransaction|simulateTransaction|getSignatureStatuses|getSignatureStatus|getLatestBlockhash|getRecentBlockhash|isBlockhashValid|getFeeForMessage|requestAirdrop|getSignaturesForAddress|getTransaction|getSlot|getBlockHeight)" 1;
}

# JSON-RPC permits batching, which arrives as a top-level array. A single batch
# can mix a cacheable read with sendTransaction, and a method-name regex alone
# would happily cache the whole thing. Refuse arrays outright.
map $request_body $opta_rpc_batch {
    default        0;
    ~*^[[:space:]]*\[  1;
}

# Combine. Note nginx ALWAYS keeps GET and HEAD cacheable once proxy_cache is on
# (proxy_cache_methods cannot remove them), and this same location carries
# WebSocket upgrades — so a non-empty Upgrade header must also bypass the cache
# or subscriptions would be answered from it.
#
# "100" = allowed, not denied, not a batch, and no Upgrade header. Everything
# else, including every unparsed body, falls through to the default of 1.
map "$opta_rpc_allow$opta_rpc_deny$opta_rpc_batch$http_upgrade" $opta_rpc_nocache {
    default 1;
    "100"   0;
}
