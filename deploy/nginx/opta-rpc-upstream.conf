# Opta RPC proxy — upstream auth + address-family directives. Ticket 86eynebyz.
#
# These live inside `location /devnet` in /etc/nginx/sites-available/rpc.opta.fyi
# (note: NO .conf suffix on that filename — a scan for *.conf misses it entirely
# and will report the proxy as keyless).
#
# Replace <UPSTREAM_KEY> with the key from ~/.opta-rpc-helius at deploy time.
# NEVER commit the real value.
#
# ---------------------------------------------------------------------------
# WHY AUTH IS A HEADER AND NOT A QUERY PARAMETER
# ---------------------------------------------------------------------------
# nginx logs the UPSTREAM url on connection failures. The key used to be injected
# into the query string, so every unreachable-upstream event wrote it to
# error.log in plaintext:
#
#   connect() to [2606:4700:440d::6812:24a9]:443 failed (101: Unknown error)
#   while connecting to upstream, ... upstream: "https://[...]:443/?api-key=<KEY>"
#
# 6,863 such lines existed across live and rotated logs before this change. A
# request header is not logged by default, so moving the key off the URL removes
# the leak CLASS rather than one symptom.
#
# Header support was established EMPIRICALLY (it is not in the published docs),
# using an AUTHENTICATED method:
#
#   x-api-key: <key>              -> 200, numeric balance   AUTHENTICATED
#   Authorization: Bearer <key>   -> 200, numeric balance   AUTHENTICATED
#   api-key: <key>                -> 401 -32401             not supported
#   Authorization: <key>          -> 401 -32401             not supported
#   no key at all                 -> 401 -32401             control holds
#
# Do NOT verify this with getHealth. getHealth answers {"result":"ok"} with a
# completely fake key, so it cannot tell an authenticated request from an
# unauthenticated one. An earlier version of this test used getHealth and every
# variant "passed", including the no-key control — which is what exposed it.
#
# Because header auth is undocumented, treat it as revocable: if the upstream ever
# stops honouring it, requests return 401 -32401 and the alarm raises KEY_INVALID
# within one probe cycle. Rollback is a one-line revert to
#   set $args "api-key=<UPSTREAM_KEY>";
#
# ---------------------------------------------------------------------------
# WHY THE HOST IS A VARIABLE
# ---------------------------------------------------------------------------
# The upstream publishes AAAA records; this box has no global IPv6 address and no
# default IPv6 route. Roughly half of upstream connections therefore tried an
# unreachable v6 address, failed, logged, and fell back to IPv4 — the failure
# class that produced the leaked lines, plus a wasted connect on every occurrence.
#
# /etc/gai.conf precedence was tried FIRST and did not fix it: it reorders
# getaddrinfo results, but nginx retains every resolved address and round-robins
# across families, so ordering changes nothing.
#
# `resolver ... ipv6=off` is the mechanism that works, and nginx 1.18 only honours
# it when proxy_pass contains a VARIABLE — a literal hostname is resolved once at
# config load and bypasses the resolver entirely. Hence $opta_upstream.
#
# Measured after this change: 12 consecutive requests produced ZERO new
# "connect() to [" failures, down from roughly half of all connections.
#
# Note the URI semantics: with a variable in proxy_pass the specified URI replaces
# the request URI, so "/" maps /devnet -> / upstream, matching the previous
# trailing-slash behaviour.

# Auth travels in a header, never in the URL.
set $args "";
proxy_set_header x-api-key <UPSTREAM_KEY>;

# Suppress AAAA so the unreachable-v6 failure class cannot fire.
resolver 127.0.0.53 ipv6=off valid=60s;
resolver_timeout 5s;
set $opta_upstream "devnet.helius-rpc.com";
proxy_pass https://$opta_upstream/;

proxy_set_header Host devnet.helius-rpc.com;
proxy_ssl_server_name on;
