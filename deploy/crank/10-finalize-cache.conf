# Drop-in for opta-crank.service — ticket 86eyn66b4 (D1).
#
# Deployed as /etc/systemd/system/opta-crank.service.d/10-finalize-cache.conf
#
# WHY THIS IS NEEDED
#   The main unit runs ProtectSystem=strict with ReadWritePaths=/opt/opta-crank,
#   so the whole filesystem outside that tree is read-only to the process. The
#   persistent finalize cache lives in /var/lib/opta-crank, and without this
#   drop-in every flush failed with:
#
#       EROFS: read-only file system, open '/var/lib/opta-crank/fully-finalized.json.tmp'
#
#   The crank kept running (a flush failure is logged, never fatal — losing the
#   cache costs credits, not correctness) but persistence achieved nothing, which
#   is the whole point of D1.
#
# StateDirectory does three things at once: creates /var/lib/opta-crank, chowns it
# to User=, and adds it to the writable set. Preferred over a bare ReadWritePaths
# so the directory cannot go missing.
#
# Kept as a drop-in rather than an edit to the main unit so it can be reverted by
# deleting one file, leaving the audited sandbox directives untouched.
[Service]
StateDirectory=opta-crank
